<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"width="width=device-width, initial-scale=1.0" />
        <title>Neigungssensor V5.2</title>
        <style>
            @font-face {
                font-family: "Numbers";
                src: url("https://benla25.github.io/numbers.ttf") format("truetype");
                font-weight: normal;
                font-style: normal;
            }
            @font-face {
                font-family: "Text";
                src: url("https://benla25.github.io/tasks-lite-app/resources/Sans Text.ttf") format("truetype");
                font-weight: normal;
                font-style: normal;
            }
            body {
                background: #000;
                color: #007BFF;
                font-family: "Text", sans-serif;
                text-align: center;
                -webkit-touch-callout: none; 
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none; 
                text-shadow: 0px 0px 5px;
                align-items: center;
            }
            .current {
                position: relative;
                margin-bottom: -35px;
                font-size: 20px;
                font-weight: bold;
                color: #007BFF;
                text-shadow: 0px 0px 2px;
            }
            .data {
                font-family: "Numbers", monospace;
                font-size: 35px;
                font-style: italic;
                color: #7BFF00;
                text-shadow: 0px 0px 5px #7BFF00;
                opacity: 0.4;
            }
            hr {
                width: 110px;
                border: 1px solid #007BFF;
                border-radius: 5px;
                box-shadow: 0px 0px 5px;
                padding: 0px;
            }
            .records {
                position: relative;
                margin-top: -10px;
                font-size: 15px;
                color: #007BFF;
                text-shadow: 0px 0px 5px #007BFF;
            }
            .rec-txt {
                position: relative;
                margin-bottom: -27px;
            }
            .arrows {
                font-family: "Numbers", monospace;
                color: #7BFF00;
                font-style: italic;
                opacity: 0.4;
            }
            .lr {
                padding: 0px 7px;
            }
            .record-val {
                font-family: "Numbers", monospace;
                color: #7BFF00;
                text-shadow: 0px 0px 5px #7BFF00;
                font-style: italic;
            }
            button {
                font-family: "Text", sans-serif;
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                color: #007BFF;
                background: black;
                border: 1px solid #007BFF;
                border-radius: 50px;
                text-shadow: 0px 0px 5px;
                box-shadow: 0px 0px 5px #007BFF;
                width: 195px;
                -webkit-touch-callout: none; 
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }
            #reset-btn {
                color: #FF7B00;
                display: none;
            }
            .watermark {
                margin-left: calc(50vw - 125px);
                margin-right: calc(50vw - 125px);
            }
            .wmu {
                display: flex;
                font-size: 4px;
                text-align: center;
                font-weight: bold;
                text-shadow: 0 0 0;
            }
            #max-left, #max-right {
                opacity: 0.4;
            }

            /* Halbkreis hinter dem ersten <p> */
            .p-container {
                position: relative;
                margin-top: 80px;
            }
            .halfcircle {
                position: absolute;
                top: -20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 0;
                opacity: 0.4;
            }
            .current,
            .data {
                position: relative;
                z-index: 1;
            }
            .tick {
                stroke: #7BFF00;
                stroke-width: 2;
                box-shadow: 0px 0px 2px;
                border-radius: 3px;
            }
        </style>
    </head>
    <body>
        <p class="p-container">
            <!-- Halbkreis hinter dem Text -->
            <svg class="halfcircle" width="300" height="160" viewBox="0 0 300 160">
                <g id="ticks" transform="rotate(-90,150,120)"></g>
            </svg>

            <div class="current">
                Aktuell:
            </div>
            <br />
            <span id="beta" class="data">
                &nbsp;&nbsp;&nbsp;-.-
            </span>
        </p>

        <div class="watermark"><div class="wmu"><hr>iVGN<hr></div></div>
        <div class="records">
            <p>
                <div class="rec-txt">
                    Höchstwerte:
                </div>
                <br />
                <span class="arrows" id="al"><</span>
                <span id="max-left" class="record-val">&nbsp;&nbsp;-.-</span>
                <span class="lr">|</span>
                <span id="max-right" class="record-val">&nbsp;&nbsp;-.-</span>
                <span class="arrows" id="ar">></span>
            </p>
            <button id="reset-btn">
                Werte zurücksetzen
            </button>
            <button id="request-permission">
                Sensor aktivieren
            </button>
        </div>

        <script>
            const requestBtn = document.getElementById('request-permission');
            const resetBtn = document.getElementById('reset-btn');

            let maxLeft = 0;
            let maxRight = 0;

            // Hilfsvariablen für das 125ms-Intervall
            let aktuelleBeta = 0;
            let aktuelleArrow = "\u00A0";
            let hatBetaDaten = false;

            let wakeLock = null;
            async function enableWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request("screen");
                } catch (e) {
                    console.log("WakeLock nicht verfügbar:", e);
                }
            }
            enableWakeLock();

            async function lockOrientation() {
                try {
                    await screen.orientation.lock("portrait");
                } catch (e) {
                    console.log("Ausrichtungssperre nicht möglich:", e);
                }
            }

            function fmt(v) {
                return Math.abs(v).toFixed(1).padStart(5, "\u00A0");
            }

            // Halbkreis / Ticks
            const ticksGroup = document.getElementById("ticks");
            const centerX = 150;
            const centerY = 120;
            const radiusOuter = 120;
            const radiusInner = 105;

            function drawTicks(beta) {
                ticksGroup.innerHTML = "";

                // Begrenzung
                const minAngle = -45;
                const maxAngle = 45;

                // beta clampen
                const limitedBeta = Math.max(minAngle, Math.min(beta, maxAngle));

                const count = Math.abs(limitedBeta);

                for (let i = 0; i <= count; i++) {
                    const angle = limitedBeta >= 0 ? i : -i;
                    const rad = (angle * Math.PI) / 180;

                    const xOuter = centerX + radiusOuter * Math.cos(rad);
                    const yOuter = centerY + radiusOuter * Math.sin(rad);

                    const xInner = centerX + radiusInner * Math.cos(rad);
                    const yInner = centerY + radiusInner * Math.sin(rad);

                    const tick = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    tick.setAttribute("x1", xInner);
                    tick.setAttribute("y1", yInner);
                    tick.setAttribute("x2", xOuter);
                    tick.setAttribute("y2", yOuter);
                    tick.setAttribute("class", "tick");
                    ticksGroup.appendChild(tick);
                }
            }
            // Initial: Halbkreis sichtbar
            drawTicks(0);

            function startOrientationTracking() {
                // INTERVALL: Aktualisiert alle Anzeigen auf dem Bildschirm alle 125 ms
                setInterval(() => {
                    if (hatBetaDaten) {
                        document.getElementById('beta').textContent = aktuelleArrow + fmt(aktuelleBeta);
                        document.getElementById('beta').style.opacity = 1;
                    }

                    // Max-Left Anzeige aktualisieren (nur wenn ein Maximalwert existiert)
                    if (maxLeft !== 0) {
                        document.getElementById('max-left').textContent = fmt(Math.abs(maxLeft));
                        document.getElementById('max-left').style.opacity = 1;
                       document.getElementById('al').style.opacity = 1;
                    }

                    // Max-Right Anzeige aktualisieren (nur wenn ein Maximalwert existiert)
                    if (maxRight !== 0) {
                        document.getElementById('max-right').textContent = fmt(maxRight);
                        document.getElementById('max-right').style.opacity = 1;
                        document.getElementById('ar').style.opacity = 1;
                    }
                }, 125);

                window.addEventListener('deviceorientation', (event) => {
                    let beta = event.beta || 0;
                    let gamma = event.gamma || 0;

                    if (gamma < -80 && gamma > -100) {
                        lockOrientation();
                    }

                    let arrow = "\u00A0";
                    if (beta < -0.05) arrow = "<";
                    else if (beta > 0.05) arrow = ">";

                    // Daten im Hintergrund für das Intervall zwischenspeichern
                    aktuelleBeta = beta;
                    aktuelleArrow = arrow;
                    hatBetaDaten = true;

                    // Höchstwerte in Echtzeit im Hintergrund ermitteln
                    if (beta < -0.05) {
                        if (beta < maxLeft) {
                            maxLeft = beta;
                        }
                    } else if (beta > 0.05) {
                        if (beta > maxRight) {
                            maxRight = beta;
                        }
                    }

                    // Halbkreis-Ticks mit echter Neigung aktualisieren
                    drawTicks(beta);
                });

                requestBtn.style.display = 'none';
                resetBtn.style.display = 'inline-block';
            }

            resetBtn.addEventListener('click', () => {
                maxLeft = 0;
                maxRight = 0;
                // Sofortiges Zurücksetzen der UI-Anzeige beim Klick
                document.getElementById('max-left').textContent = "\u00A0\u00A0-.-";
                document.getElementById('max-left').style.opacity = 0.4;
                document.getElementById('al').style.opacity = 0.4;
                document.getElementById('max-right').textContent = "\u00A0\u00A0-.-";
                document.getElementById('max-right').style.opacity = 0.4;
                document.getElementById('ar').style.opacity = 0.4;
                drawTicks(0);
            });

            requestBtn.addEventListener('click', () => {
                if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {

                    DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') startOrientationTracking();
                        else alert('Zugriff verweigert.');
                    })
                    .catch(console.error);

                } else {
                    startOrientationTracking();
                }
            });
        </script>
    </body>
</html>
